services:
  - type: web
    name: pomodoro-chad
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    headers:
      - path: /_astro/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /vault/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /sounds/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /images/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /favicon.svg
        name: Cache-Control
        value: public, max-age=86400
      - path: /llms.txt
        name: Cache-Control
        value: public, max-age=3600
      - path: /.well-known/*
        name: Cache-Control
        value: public, max-age=3600
      - path: /ai-catalog.json
        name: Cache-Control
        value: public, max-age=3600
      - path: /robots.txt
        name: Cache-Control
        value: public, max-age=3600
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
