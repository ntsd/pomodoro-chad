<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="32" cy="32" r="30" fill="#0a0d12" stroke="#10b981" stroke-width="2.5" />
  
  <!-- Outer timer ring track & active arc -->
  <circle cx="32" cy="32" r="23" fill="none" stroke="#161f30" stroke-width="3" />
  <path d="M 32 9 A 23 23 0 1 1 15 48" fill="none" stroke="url(#emeraldGrad)" stroke-width="3.5" stroke-linecap="round" />

  <!-- Top Timer Knob -->
  <rect x="29" y="3" width="6" height="4" rx="1.5" fill="url(#goldGrad)" />

  <!-- GigaChad Royal Crown -->
  <path d="M 18 38 L 20 25 L 26 31 L 32 20 L 38 31 L 44 25 L 46 38 Z" fill="url(#goldGrad)" stroke="#b45309" stroke-width="1" stroke-linejoin="round" />
  <!-- Crown Base Band -->
  <rect x="18" y="38" width="28" height="5" rx="1.5" fill="#d97706" />
  <!-- Crown Jewels / Highlights -->
  <circle cx="32" cy="23" r="1.5" fill="#ffffff" />
  <circle cx="21" cy="27" r="1.2" fill="#ffffff" />
  <circle cx="43" cy="27" r="1.2" fill="#ffffff" />
  <circle cx="32" cy="40.5" r="1.5" fill="#34d399" />
</svg>
